name: Deploy to GitHub Pages

# The public site has moved to https://the-agent-daily.org — this workflow
# now publishes a minimal client-side redirect instead of the full static
# build. index.html covers the site root; 404.html covers every other path
# (GitHub Pages serves it for any URL that has no matching file), so all
# old deep links redirect too.
#
# To resurrect the full static site, restore the previous version of this
# file from git history (it built via `npm run build:static` into ./dist).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two concurrent runs against the same branch would race the deploy step.
# Cancel in-progress runs so only the latest push deploys.
concurrency:
  group: pages
  cancel-in-progress: true

# Minimal permissions for the deploy-pages action.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Generate redirect artifact
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>The Agent Daily</title>
            <meta name="robots" content="noindex">
            <meta http-equiv="refresh" content="0; url=https://the-agent-daily.org/">
            <link rel="canonical" href="https://the-agent-daily.org/">
            <script>window.location.replace("https://the-agent-daily.org/");</script>
          </head>
          <body>
            <p>This site has moved to <a href="https://the-agent-daily.org/">the-agent-daily.org</a>. You are being redirected automatically.</p>
          </body>
          </html>
          HTML
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
